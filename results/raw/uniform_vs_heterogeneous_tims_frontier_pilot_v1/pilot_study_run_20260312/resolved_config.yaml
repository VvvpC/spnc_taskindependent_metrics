    trial_results_table_path: results/raw/uniform_vs_heterogeneous_tims_frontier_pilot_v1/pilot_study_run_20260312/trial_results_table.csv
    failure_log_path: results/raw/uniform_vs_heterogeneous_tims_frontier_pilot_v1/pilot_study_run_20260312/failure_log.jsonl
    run_summary_path: results/raw/uniform_vs_heterogeneous_tims_frontier_pilot_v1/pilot_study_run_20260312/run_summary.json
    run_manifest_path: results/raw/uniform_vs_heterogeneous_tims_frontier_pilot_v1/pilot_study_run_20260312/run_manifest.json
    frontier_points_table_path: results/processed/uniform_vs_heterogeneous_tims_frontier_pilot_v1/frontier_points_table.csv
    logs_dir: results/raw/uniform_vs_heterogeneous_tims_frontier_pilot_v1/pilot_study_run_20260312/logs
analysis:
  primary_output: frontier_points_table
  frontier:
    source_table: trial_results
    algorithm: pareto_nondominated
    dominance_epsilon: 0.0
    deduplicate_points: true
    deduplicate_tolerance: 1.0e-12
    metrics:
    - MC
    - CQ
    directions:
      MC: maximize
      CQ: maximize
  comparison:
    baseline_family: uniform
    candidate_family: heterogeneous
    compute_frontier_difference: true
    compute_nondominated_overlap: true
    compute_point_cloud_summary: true
  secondary_metric_summaries:
    enabled: true

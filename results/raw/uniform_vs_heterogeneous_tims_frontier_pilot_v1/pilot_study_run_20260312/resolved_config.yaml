study:
  study_id: uniform_vs_heterogeneous_tims_frontier_pilot_v1
  title: Uniform vs Heterogeneous TIMs Frontier Pilot Study
  phase: phase1_tims_frontier
  objective: compare_family_level_mc_cq_frontier
  description: Research-grade pilot study using real builder and TIM evaluators.
  tags:
  - TIMs
  - frontier
  - pilot-study
  - real-evaluator
comparison:
  compared_families:
  - uniform
  - heterogeneous
  baseline_family: uniform
  candidate_family: heterogeneous
  primary_endpoint:
    kind: pareto_frontier_difference
    frontier_objectives:
    - MC
    - CQ
    directions:
      MC: maximize
      CQ: maximize
    output_artifact: frontier_points_table
  secondary_endpoints:
  - KR_summary
  - GR_summary
  fairness_protocol:
    shared_non_geometric_search: true
    shared_trial_budget: true
    shared_exploration_strategy: true
    shared_evaluators: true
    shared_trial_seed_rule: true
    geometry_match_required: false
reservoir:
  backend:
    uniform_builder: legacy_uniform_spnc
    heterogeneous_builder: legacy_morphology_reservoir
  shared_defaults:
    physical:
      h: 0.4
      theta_H: 90
      k_s_0: 0
      phi: 45
    network:
      bias: true
      Nwarmup: 0
      Nvirt: 100
    simulation:
      delay_feedback: 0
      voltage_noise: false
      johnson_noise: false
      thermal_noise: false
    mask:
      fixed_mask: true
      seed_mask_mode: derived_from_trial_seed
      max_sequences_mask: false
  bindings:
    reference_beta_param: beta_prime
families:
  uniform:
    enabled: true
    family_kind: uniform
    label: Uniform reservoir family
    resolved_construction:
      geometry_mode: uniform
      parameters: {}
  heterogeneous:
    enabled: true
    family_kind: heterogeneous
    label: Heterogeneous reservoir family
    resolved_construction:
      geometry_mode: distributional_beta
      morphology:
        scheme: random
        reference_beta_param: beta_prime
        n_instances: 3
        beta_spread: 3.0
        beta_sampling_rule: uniform_in_reference_plus_minus_spread
        clip_beta_to_positive: true
        weights_mode: equal
        morphology_seed_mode: derived_from_trial_seed
evaluation:
  tims:
    recorded_metrics:
    - MC
    - KR
    - GR
    - CQ
    primary_metrics:
    - MC
    - CQ
    secondary_metrics:
    - KR
    - GR
    metric_directions:
      MC: maximize
      KR: maximize
      GR: minimize
      CQ: maximize
    mc:
      signal_len: 120
      delays: 10
      splits:
      - 0.2
      - 0.6
      signal_seed_mode: derived_from_trial_seed
    kr_gr:
      n_wash: 5
      threshold: 0.001
      signal_seed_mode: derived_from_trial_seed
      state_normalization: divide_by_max
      n_readouts_from: Nvirt
      n_readouts_value: 100
    cq:
      mode: derived
      formula: KR_minus_GR
      expression: CQ = KR - GR
      source_metrics:
      - KR
      - GR
      store_as_explicit_metric: true
  tasks:
    enabled: false
exploration:
  method: optuna
  study_mode: per_family_independent_studies
  optuna:
    sampler: NSGAIISampler
    sampler_seed: 1234
    pruner: null
    n_trials_per_family: 50
    n_startup_trials: 10
    study_direction_mode: multi_objective
    objective_metrics:
    - MC
    - CQ
    objective_directions:
      MC: maximize
      CQ: maximize
  coupling:
    shared_trial_seed_rule: true
    identical_trial_suggestions_across_families: false
  budget:
    equal_budget_across_families: true
    max_failures_per_family: 20
    timeout_seconds: null
  search_space:
    beta_prime:
      type: float
      low: 27.0
      high: 33.0
    theta:
      type: float
      low: 0.12
      high: 0.28
    gamma:
      type: float
      low: 0.03
      high: 0.09
    m0:
      type: float
      low: 0.006
      high: 0.018
    Nvirt:
      type: fixed
      value: 100
execution:
  run_id_mode: auto
  seed_policy:
    global_seed: 1234
    trial_seed_mode: deterministic_from_trial_index
    matched_trial_seed_across_families: true
    derived_seed_targets:
    - input_signal
    - mask
    - morphology
  parallelism:
    max_workers: 1
  retry:
    max_attempts_per_trial: 1
    retry_on_exception: true
  resume:
    enabled: true
    resume_mode: from_manifest
  failure_policy:
    on_trial_failure: record_and_continue
  logging:
    level: INFO
    capture_stdout: true
    save_trial_logs: true
storage:
  root_dir: results
  raw_dir: results/raw
  processed_dir: results/processed
  report_dir: reports
  path_templates:

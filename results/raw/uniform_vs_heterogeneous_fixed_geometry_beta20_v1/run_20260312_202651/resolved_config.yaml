      h: 0.4
      theta_H: 90
      k_s_0: 0
      phi: 45
    network:
      bias: true
      Nwarmup: 0
      Nvirt: 100
    simulation:
      delay_feedback: 0
      voltage_noise: false
      johnson_noise: false
      thermal_noise: false
    mask:
      fixed_mask: true
      seed_mask_mode: derived_from_trial_seed
      max_sequences_mask: false
  bindings:
    reference_beta_param: beta_prime
families:

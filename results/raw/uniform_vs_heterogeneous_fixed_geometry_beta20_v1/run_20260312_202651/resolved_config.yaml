  title: Uniform vs Heterogeneous TIMs Comparison at Fixed beta_prime = 20
  phase: phase1_tims_frontier
  objective: controlled_geometry_only_comparison
  description: Fixed-parameter repeated TIMs evaluation with matched non-geometric
    parameters and fixed heterogeneous geometry.

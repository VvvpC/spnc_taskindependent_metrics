    - MC
    - CQ
    secondary_metrics:
    - KR
    - GR
    metric_directions:
      MC: maximize
      KR: maximize
      GR: minimize
      CQ: maximize
    mc:
      signal_len: 120
      delays: 10
      splits:
      - 0.2
      - 0.6
      signal_seed_mode: derived_from_trial_seed
    kr_gr:
      n_wash: 5
      threshold: 0.001
      signal_seed_mode: derived_from_trial_seed
      state_normalization: divide_by_max
      n_readouts_from: Nvirt
      n_readouts_value: 100
    cq:
      mode: derived
      formula: KR_minus_GR
      expression: CQ = KR - GR
      source_metrics:

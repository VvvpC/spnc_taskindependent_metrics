# Single-factor TIMs sweep
# ------------------------
# Paired uniform-vs-heterogeneous sweep where each parameter is varied alone
# while the remaining nominal settings stay fixed.

schema_version: "0.3.1"

specification_ref:
  spec_id: "tims_frontier_specification"
  spec_status: "accepted-baseline"
  spec_path: "reports/specifications/tims_frontier_specification.md"

study:
  study_id: "uniform_vs_heterogeneous_single_factor_tims_sweep_v1"
  title: "Uniform vs Heterogeneous Single-Factor TIMs Sweep"
  phase: "phase1_single_factor_sweep"
  objective: "paired_single_factor_tims_sensitivity"
  description: "Sweep one parameter at a time and record paired uniform-vs-heterogeneous TIMs responses."
  tags:
    - "TIMs"
    - "single-factor-sweep"
    - "paired-baseline"
    - "vscode-runner"

single_factor_sweep:
  parameter_order:
    - "beta_prime"
    - "theta"
    - "gamma"
    - "m0"
    - "n_instances"
    - "beta_spread"
  parameters:
    beta_prime:
      kind: "float"
      low: 20.0
      high: 50.0
      num_points: 10
    theta:
      kind: "float"
      low: 0.01
      high: 0.6
      num_points: 10
    gamma:
      kind: "float"
      low: 0.01
      high: 0.2
      num_points: 10
    m0:
      kind: "float"
      low: 0.001
      high: 0.01
      num_points: 10
    n_instances:
      kind: "int"
      low: 2
      high: 11
      num_points: 10
    beta_spread:
      kind: "float"
      low: 1.0
      high: 10.0
      num_points: 10

comparison:
  compared_families:
    - "uniform"
    - "heterogeneous"
  baseline_family: "uniform"
  candidate_family: "heterogeneous"
  primary_endpoint:
    kind: "paired_single_factor_recording"
    frontier_objectives:
      - "MC"
      - "CQ"
    directions:
      MC: "maximize"
      CQ: "maximize"
    output_artifact: "parameter_sweep_tables"
  secondary_endpoints:
    - "KR_summary"
    - "GR_summary"
  fairness_protocol:
    shared_non_geometric_search: true
    shared_trial_budget: true
    shared_exploration_strategy: false
    shared_evaluators: true
    shared_trial_seed_rule: true
    geometry_match_required: false

reservoir:
  backend:
    uniform_builder: "legacy_uniform_spnc"
    heterogeneous_builder: "legacy_morphology_reservoir"
  shared_defaults:
    physical:
      h: 0.4
      theta_H: 90
      k_s_0: 0
      phi: 45
    network:
      bias: true
      Nwarmup: 0
    simulation:
      delay_feedback: 0
      voltage_noise: false
      johnson_noise: false
      thermal_noise: false
    mask:
      fixed_mask: true
      seed_mask_mode: "derived_from_trial_seed"
      max_sequences_mask: false
  parameter_binding:
    reference_beta_param: "beta_prime"
    Nvirt_source: "exploration.shared_non_geometric_search.Nvirt"

families:
  uniform:
    enabled: true
    family_kind: "uniform"
    label: "Uniform reservoir family"
    construction:
      geometry_mode: "uniform"
      parameters: {}

  heterogeneous:
    enabled: true
    family_kind: "heterogeneous"
    label: "Heterogeneous reservoir family"
    construction:
      geometry_mode: "distributional_beta"
      morphology:
        scheme:
          type: "fixed"
          value: "random"
        reference_beta_source: "exploration.shared_non_geometric_search.beta_prime"
        n_instances:
          type: "fixed"
          value: 5
        beta_spread:
          type: "fixed"
          value: 3.0
        beta_sampling_rule: "uniform_in_reference_plus_minus_spread"
        clip_beta_to_positive: true
        weights_mode:
          type: "fixed"
          value: "equal"
        morphology_seed:
          mode: "fixed"
          value: 3897761708

evaluation:
  tims:
    recorded_metrics:
      - "MC"
      - "KR"
      - "GR"
      - "CQ"
    primary_metrics:
      - "MC"
      - "CQ"
    secondary_metrics:
      - "KR"
      - "GR"
    metric_directions:
      MC: "maximize"
      KR: "maximize"
      GR: "minimize"
      CQ: "maximize"
    mc:
      signal_len: 120
      delays: 10
      splits:
        - 0.2
        - 0.6
      signal_seed_mode: "derived_from_trial_seed"
    kr_gr:
      n_readouts: "inherit_from_Nvirt"
      n_wash: 5
      threshold: 0.001
      signal_seed_mode: "derived_from_trial_seed"
      state_normalization: "divide_by_max"
    cq:
      mode: "derived"
      formula: "KR_minus_GR"
      expression: "CQ = KR - GR"
      source_metrics:
        - "KR"
        - "GR"
      store_as_explicit_metric: true
  tasks:
    enabled: false

exploration:
  method: "single_factor_sweep"
  study_mode: "paired_parameter_sweep"
  shared_non_geometric_search:
    beta_prime:
      type: "fixed"
      value: 20.0
    theta:
      type: "fixed"
      value: 0.2
    gamma:
      type: "fixed"
      value: 0.05
    m0:
      type: "fixed"
      value: 0.01
    Nvirt:
      type: "fixed"
      value: 100
  optuna:
    objective_ref: "comparison.primary_endpoint"
    sampler: "NSGAIISampler"
    sampler_seed: 1234
    pruner: null
    n_trials_per_family: 30
    n_startup_trials: 0
    study_direction_mode: "multi_objective"
  coupling:
    shared_trial_seed_rule: true
    identical_trial_suggestions_across_families: true
  budget:
    equal_budget_across_families: true
    max_failures_per_family: 10
    timeout_seconds: null

execution:
  run_id_mode: "auto"
  seed_policy:
    global_seed: 1234
    trial_seed_mode: "deterministic_from_trial_index"
    matched_trial_seed_across_families: true
    derived_seed_targets:
      - "input_signal"
      - "mask"
      - "morphology"
  parallelism:
    max_workers: 1
  retry:
    max_attempts_per_trial: 1
    retry_on_exception: true
  resume:
    enabled: true
    resume_mode: "from_manifest"
  failure_policy:
    on_trial_failure: "record_and_continue"
  logging:
    level: "INFO"
    capture_stdout: true
    save_trial_logs: true

storage:
  root_dir: "results"
  raw_dir: "results/raw"
  processed_dir: "results/processed"
  report_dir: "reports"
  path_templates:
    study_root: "results/raw/{study_id}"
    run_root: "results/raw/{study_id}/{run_id}"
    processed_study_root: "results/processed/{study_id}"
  save:
    user_config_copy: true
    resolved_config: true
    trial_results_table_csv: true
    frontier_points_table_csv: true
    optuna_study_summary_json: false
    failure_log_json: true
    runtime_metadata_json: true
    intermediate_states_npz: false
    figures: false
  formats:
    table: "csv"
    metadata: "json"
    arrays: "npz"
    figures: "png"
  provenance:
    record_git_commit: true
    record_git_branch: true
    record_hostname: true
    record_python_version: true

analysis:
  primary_output: "parameter_sweep_tables"
  frontier:
    endpoint_ref: "comparison.primary_endpoint"
    source_table: "trial_results"
    algorithm: "pareto_nondominated"
    dominance_epsilon: 0.0
    deduplicate_points: true
    deduplicate_tolerance: 1.0e-12
  comparison:
    baseline_family: "uniform"
    candidate_family: "heterogeneous"
    compute_frontier_difference: false
    compute_nondominated_overlap: false
    compute_point_cloud_summary: false
  secondary_metric_summaries:
    enabled: false
    metrics:
      KR: "maximize"
      GR: "minimize"

reporting:
  language: "zh-CN"
  outputs:
    markdown_summary: false
    json_summary: true
    figure_manifest: false
    frontier_points_table: false
  figures:
    generate_primary_frontier_plot: false
    primary_projection:
      - "MC"
      - "CQ"
    generate_secondary_metric_plots: false
  include:
    study_metadata: true
    comparison_protocol: true
    key_findings: false
    failure_summary: true
    caveats: true

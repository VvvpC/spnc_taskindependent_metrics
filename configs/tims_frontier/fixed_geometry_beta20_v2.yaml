# Fixed-parameter geometry comparison, morphology-seed sweep
# ----------------------------------------------------------
# Meta-study configuration for repeating the same uniform-vs-heterogeneous
# comparison across multiple heterogeneous morphology realizations.

schema_version: "0.3.1"

specification_ref:
  spec_id: "tims_frontier_specification"
  spec_status: "accepted-baseline"
  spec_path: "reports/specifications/tims_frontier_specification.md"

study:
  study_id: "uniform_vs_heterogeneous_fixed_geometry_beta20_v2"
  title: "Uniform vs Heterogeneous TIMs Comparison at Fixed beta_prime = 20 (Morphology Seed Sweep)"
  phase: "phase1_tims_frontier"
  objective: "controlled_geometry_realization_consistency_check"
  description: "Repeat the same fixed-parameter uniform-vs-heterogeneous comparison across multiple heterogeneous morphology seeds."
  tags:
    - "TIMs"
    - "fixed-geometry"
    - "beta20"
    - "morphology-seed-sweep"
    - "vscode-runner"

seed_sweep:
  morphology_seeds:
    - 3897761708
    - 2718281828
    - 3141592653
    - 1618033988
    - 1234567891
  n_trials_per_family: 100

comparison:
  compared_families:
    - "uniform"
    - "heterogeneous"
  baseline_family: "uniform"
  candidate_family: "heterogeneous"
  primary_endpoint:
    kind: "pareto_frontier_difference"
    frontier_objectives:
      - "MC"
      - "CQ"
    directions:
      MC: "maximize"
      CQ: "maximize"
    output_artifact: "frontier_points_table"
  secondary_endpoints:
    - "KR_summary"
    - "GR_summary"
  fairness_protocol:
    shared_non_geometric_search: true
    shared_trial_budget: true
    shared_exploration_strategy: false
    shared_evaluators: true
    shared_trial_seed_rule: true
    geometry_match_required: false

reservoir:
  backend:
    uniform_builder: "legacy_uniform_spnc"
    heterogeneous_builder: "legacy_morphology_reservoir"
  shared_defaults:
    physical:
      h: 0.4
      theta_H: 90
      k_s_0: 0
      phi: 45
    network:
      bias: true
      Nwarmup: 0
    simulation:
      delay_feedback: 0
      voltage_noise: false
      johnson_noise: false
      thermal_noise: false
    mask:
      fixed_mask: true
      seed_mask_mode: "derived_from_trial_seed"
      max_sequences_mask: false
  parameter_binding:
    reference_beta_param: "beta_prime"
    Nvirt_source: "exploration.shared_non_geometric_search.Nvirt"

families:
  uniform:
    enabled: true
    family_kind: "uniform"
    label: "Uniform reservoir family"
    construction:
      geometry_mode: "uniform"
      parameters: {}

  heterogeneous:
    enabled: true
    family_kind: "heterogeneous"
    label: "Heterogeneous reservoir family"
    construction:
      geometry_mode: "distributional_beta"
      morphology:
        scheme:
          type: "fixed"
          value: "random"
        reference_beta_source: "exploration.shared_non_geometric_search.beta_prime"
        n_instances:
          type: "fixed"
          value: 5
        beta_spread:
          type: "fixed"
          value: 3.0
        beta_sampling_rule: "uniform_in_reference_plus_minus_spread"
        clip_beta_to_positive: true
        weights_mode:
          type: "fixed"
          value: "equal"
        morphology_seed:
          mode: "fixed"
          value: 3897761708

evaluation:
  tims:
    recorded_metrics:
      - "MC"
      - "KR"
      - "GR"
      - "CQ"
    primary_metrics:
      - "MC"
      - "CQ"
    secondary_metrics:
      - "KR"
      - "GR"
    metric_directions:
      MC: "maximize"
      KR: "maximize"
      GR: "minimize"
      CQ: "maximize"
    mc:
      signal_len: 120
      delays: 10
      splits:
        - 0.2
        - 0.6
      signal_seed_mode: "derived_from_trial_seed"
    kr_gr:
      n_readouts: "inherit_from_Nvirt"
      n_wash: 5
      threshold: 0.001
      signal_seed_mode: "derived_from_trial_seed"
      state_normalization: "divide_by_max"
    cq:
      mode: "derived"
      formula: "KR_minus_GR"
      expression: "CQ = KR - GR"
      source_metrics:
        - "KR"
        - "GR"
      store_as_explicit_metric: true
  tasks:
    enabled: false

exploration:
  method: "fixed_repeated_eval"
  study_mode: "matched_repeated_trials"
  shared_non_geometric_search:
    beta_prime:
      type: "fixed"
      value: 20.0
    theta:
      type: "fixed"
      value: 0.2
    gamma:
      type: "fixed"
      value: 0.05
    m0:
      type: "fixed"
      value: 0.01
    Nvirt:
      type: "fixed"
      value: 100
  optuna:
    objective_ref: "comparison.primary_endpoint"
    sampler: "NSGAIISampler"
    sampler_seed: 1234
    pruner: null
    n_trials_per_family: 100
    n_startup_trials: 0
    study_direction_mode: "multi_objective"
  coupling:
    shared_trial_seed_rule: true
    identical_trial_suggestions_across_families: true
  budget:
    equal_budget_across_families: true
    max_failures_per_family: 20
    timeout_seconds: null

execution:
  run_id_mode: "auto"
  seed_policy:
    global_seed: 1234
    trial_seed_mode: "deterministic_from_trial_index"
    matched_trial_seed_across_families: true
    derived_seed_targets:
      - "input_signal"
      - "mask"
      - "morphology"
  parallelism:
    max_workers: 1
  retry:
    max_attempts_per_trial: 1
    retry_on_exception: true
  resume:
    enabled: true
    resume_mode: "from_manifest"
  failure_policy:
    on_trial_failure: "record_and_continue"
  logging:
    level: "INFO"
    capture_stdout: true
    save_trial_logs: true

storage:
  root_dir: "results"
  raw_dir: "results/raw"
  processed_dir: "results/processed"
  report_dir: "reports"
  path_templates:
    study_root: "results/raw/{study_id}"
    run_root: "results/raw/{study_id}/{run_id}"
    processed_study_root: "results/processed/{study_id}"
  save:
    user_config_copy: true
    resolved_config: true
    trial_results_table_csv: true
    frontier_points_table_csv: true
    optuna_study_summary_json: false
    failure_log_json: true
    runtime_metadata_json: true
    intermediate_states_npz: false
    figures: false
  formats:
    table: "csv"
    metadata: "json"
    arrays: "npz"
    figures: "png"
  provenance:
    record_git_commit: true
    record_git_branch: true
    record_hostname: true
    record_python_version: true

analysis:
  primary_output: "frontier_points_table"
  frontier:
    endpoint_ref: "comparison.primary_endpoint"
    source_table: "trial_results"
    algorithm: "pareto_nondominated"
    dominance_epsilon: 0.0
    deduplicate_points: true
    deduplicate_tolerance: 1.0e-12
  comparison:
    baseline_family: "uniform"
    candidate_family: "heterogeneous"
    compute_frontier_difference: true
    compute_nondominated_overlap: true
    compute_point_cloud_summary: true
  secondary_metric_summaries:
    enabled: true
    metrics:
      KR: "maximize"
      GR: "minimize"

reporting:
  language: "zh-CN"
  outputs:
    markdown_summary: true
    json_summary: true
    figure_manifest: true
    frontier_points_table: true
  figures:
    generate_primary_frontier_plot: false
    primary_projection:
      - "MC"
      - "CQ"
    generate_secondary_metric_plots: false
  include:
    study_metadata: true
    comparison_protocol: true
    key_findings: true
    failure_summary: true
    caveats: true
